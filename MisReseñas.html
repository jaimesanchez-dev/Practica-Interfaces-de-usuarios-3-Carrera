<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochileros Sin Fronteras</title>
    <link rel="stylesheet" href="./style/VariablesColores.css">
    <link rel="stylesheet" href="./style/MisReseñas.css">
    <link rel="stylesheet" href="./style/footer.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/general.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <template id="plantillaReseña">
        <div class="tarjeta">
            <div class="derecha-tarjeta">   
                <img class="imagen-destino" src="" alt="">
            </div>

            <div class="izquierda-tarjeta">
                <div class="info-viaje">
                    <h2 class="nombre-destino"></h2>
                    <h3 class="descripcion-destino"></h3>
                </div>
                <div class="reseña-viaje">
                    <h2 data-i18n="escribe_reseña">Escribe tu reseña:</h2>
                    <div class="estrellas">
                        <button class="btn-estrella" data-pos="1"><img class="estrella" src="images/estrella-vacia.png" alt="estrella"></button>
                        <button class="btn-estrella" data-pos="2"><img class="estrella" src="images/estrella-vacia.png" alt="estrella"></button>
                        <button class="btn-estrella" data-pos="3"><img class="estrella" src="images/estrella-vacia.png" alt="estrella"></button>
                        <button class="btn-estrella" data-pos="4"><img class="estrella" src="images/estrella-vacia.png" alt="estrella"></button>
                        <button class="btn-estrella" data-pos="5"><img class="estrella" src="images/estrella-vacia.png" alt="estrella"></button>
                    </div>
                    <form class="inputs-reseñas">
                        <input data-i18n="titulo_reseña" type="text" class="input-reseña" name="titulo_resena" placeholder="Título de la reseña" aria-label="Título de la reseña">
                        
                        <input data-i18n="descripcion_reseña" type="text" class="input-reseña" name="descr_resena" placeholder="Descripción de la reseña" aria-label="Descripción de la reseña">
                        
                        <input data-i18n="publicar_reseña" type="submit" value="Publicar" aria-label="Publicar reseña">
                    </form>
                </div>
            </div>
        </div>
    </template>

    <header class="header">
        <img class="header-imagen" src="images/logo.png" alt="logo-web">
        <img class="header-imagen-daltonico" src="images/logo_daltonismo.png" alt="logo-web-daltonico">

        <h2><a href="Home.html" data-i18n="inicio"> Inicio </a></h2>
        <h2><a href="GaleriaDestinos.html" data-i18n="destinos"> Destinos </a></h2>
        <h2><a id="link-consejos" href="consejos.html" data-i18n="consejos"> Consejos </a></h2>
        <h2><a id="link-perfil" href="PerfilUsuario.html" data-i18n="perfil"> Perfil </a></h2>
        <h2><a href="#" data-i18n="contacto"> Contacto </a></h2>

        <div id="header-auth" class="grupo-botones">
            <button class="boton-reg" type="button" data-i18n="iniciosesion">Inicio sesion</button>
            <button class="boton-ini" type="button" data-i18n="registro">Registro</button>
        </div>

        <div class="grupo-selectores">
            <label for="moneda" class="sr-only">Selecciona moneda</label>
            <select class="header-moneda" name="moneda" id="moneda">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="YEN">YEN</option>
            </select>

            <label for="idioma" class="sr-only">Selecciona idioma</label>
            <select class="header-idioma" name="idioma" id="idioma">
                <option value="es" data-i18n="español">Español</option>
                <option value="en" data-i18n="ingles">Inglés</option>
            </select>
        </div>
    </header>

    <main class="flex-main">
        
        <h2 data-i18n="MisViajes">Mis Viajes:</h2>
        <div id="reseñaContenedor"></div>

    </main>

    <footer class="footer">
        <div class="footer-redes">
            <a href="https://www.instagram.com/" target="_blank"><img class="logo-redes"
                    src="./images/instagram-logo.png" alt="logo instagram"></a>
            <a href="https://www.tiktok.com/es/" target="_blank"><img class="logo-redes" src="./images/tiktok-logo.png"
                    alt="logo tiktok"></a>
            <a href="https://www.youtube.com/" target="_blank"><img class="logo-redes" src="./images/youtube-logo.png"
                    alt="logo youtube"></a>
        </div>

        <h3><a href="" data-i18n="politica"> Politica de Privacidad </a></h3>
        <h3><a href="" data-i18n="nosotros"> Sobre nosotros </a></h3>
        <h3><a href="" data-i18n="ayuda"> Ayuda </a></h3>

    </footer>

    <script type="module" src="script/MisReseñas.js"></script>
    <script type="module" src="./script/auth.js"></script>
    <script src="./script/temaGlobal.js"></script>
</body>

</html>
