<body>
    
    <header class="header">

        </div>

        <div class="grupo-selectores">
            <select class="header-moneda" name="moneda">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="YEN">YEN</option>
            </select>

                <input class="w apellidos">
                <div class="flex-tipo?????">

                <input class="tit_tarjeta">
                <div class="flex_horizontal">
                    <input class="dmy_tarjeta">
                    <input class="cvv_tarjeta">
                </div>
                <div class="flex_cbs">
                    <div class="fex_cb">
                        <input class="cb_comp">
                    </div>
                    <div class="fex_cb">
                        <input class="cb-masc">
                    </div class="fex_cb">
                    <div>
                        <input class="cb-intolerancias">
                    </div>
                </div>
                <input class="transporte">
                <button class="but_comprar"></button>
                <button class="but_borrar"></button>

            </form>
        </div>
    </main>
    
    <footer class="footer">
        <div class="footer-redes">
            <a href="https://www.instagram.com/" target="_blank"><img class="logo-redes" src="./images/instagram-logo.png" alt="logo instagram"></a>
            <a href="https://www.tiktok.com/es/" target="_blank"><img class="logo-redes" src="./images/tiktok-logo.png" alt="logo tiktok"></a>

        <h3><a href="" data-i18n="politica"> Politica de Privacidad </a></h3>
