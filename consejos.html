<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochileros Sin Fronteras</title>
    <link rel="stylesheet" href="./style/Consejos.css">
    <link rel="stylesheet" href="./style/footer.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/general.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    
    <header class="header">
        <img class="header-imagen" src="images/logo.png" alt="logo-web">
        
        <h2><a href="Home.html" data-i18n="inicio"> Inicio </a></h2>
        <h2><a href="GaleriaDestinos.html" data-i18n="destinos"> Destinos </a></h2>
        <h2><a href="consejos.html" data-i18n="consejos"> Consejos </a></h2>
        <h2><a href="PerfilUsuario.html" data-i18n="perfil"> Perfil </a></h2>
        <h2><a href="" data-i18n="contacto"> Contacto </a></h2>
        
        <div class="perfil-usuario">
            <img class="foto-usuario" src="images/Jorge.jpg" alt="Jorge Castañeda">
            <h2 class="nombre-usuario">Jorge Castañeda</h1>
        </div>

        <div class="grupo-selectores">
            <select class="header-moneda" name="moneda">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="YEN">YEN</option>
            </select>
            
            <select class="header-idioma" name="idioma">
                <option value="es" data-i18n="español">Español</option>
                <option value="en" data-i18n="ingles">Inglés</option>
            </select>
        </div>
    </header>

    <main class="flex-main">
        <h1>Consejos de la comunidad:</h1>

        <h1 class="titulo-formulario">¡Escribe tu consejo!</h1>
        
        <div class="formulario-container">
            <input type="text" class="input-titulo" placeholder="Título de consejo">
            <input type="text" class="input-descripcion" placeholder="Descripción del consejo">
        </div>
    </main>

    <footer class="footer">
        <div class="footer-redes">
            <a href="https://www.instagram.com/" target="_blank"><img class="logo-redes" src="./images/instagram-logo.png" alt="logo instagram"></a>
            <a href="https://www.tiktok.com/es/" target="_blank"><img class="logo-redes" src="./images/tiktok-logo.png" alt="logo tiktok"></a>
            <a href="https://www.youtube.com/" target="_blank"><img class="logo-redes" src="./images/youtube-logo.png" alt="logo youtube"></a>
        </div>
  
        <h3><a href="" data-i18n="politica"> Politica de Privacidad </a></h3>
        <h3><a href="" data-i18n="nosotros"> Sobre nosotros </a></h3>
