<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochileros Sin Fronteras</title>
    <link rel="stylesheet" href="./style/VariablesColores.css">
    <link rel="stylesheet" href="./style/GaleriaDestinos.css">
    <link rel="stylesheet" href="./style/footer.css">
    <link rel="stylesheet" href="./style/header.css">
    <link rel="stylesheet" href="./style/general.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
</head>

<template id="plantillaDestino">
    <div class="tarjeta-destino">
        <img class="imagen-destino" src="" alt="">
        <h3 class="nombre-destino"></h3>
        <h4 class="precio-destino"></h4>
    </div>
</template>

<body>
    
    <header class="header">
        <img class="header-imagen" src="images/logo.png" alt="logo-web">
        <img class="header-imagen-daltonico" src="images/logo_daltonismo.png" alt="logo-web-daltonico">
        
        <h2><a href="Home.html" data-i18n="inicio"> Inicio </a></h2>
        <h2><a href="GaleriaDestinos.html" data-i18n="destinos"> Destinos </a></h2>
        <h2><a href="consejos.html" data-i18n="consejos"> Consejos </a></h2>
        <h2><a href="PerfilUsuario.html" data-i18n="perfil"> Perfil </a></h2>
        <h2><a href="" data-i18n="contacto"> Contacto </a></h2>
        
        <div class="grupo-botones">
            <button class="boton-reg" type="button" data-i18n="iniciosesion">Inicio sesion</button>
            <button class="boton-ini" type="button" data-i18n="registro">Registro</button>
        </div>

        <div class="grupo-selectores">
            <select class="header-moneda" name="moneda">
                <option value="EUR">EUR</option>
                <option value="USD">USD</option>
                <option value="YEN">YEN</option>
            </select>
            
            <select class="header-idioma" name="idioma">
                <option value="es" data-i18n="español">Español</option>
                <option value="en" data-i18n="ingles">Inglés</option>
            </select>
        </div>
    </header>


    <main>
        
        <div class="filtros_y_buscador">
            <div class="filtros_transportes">
                <label><input type="checkbox" class="filtro-check" value="avion" checked>Avión</label>
                <label><input type="checkbox" class="filtro-check" value="barco" checked>Barco</label>
                <label><input type="checkbox" class="filtro-check" value="tren" checked>Tren</label>
                <label><input type="checkbox" class="filtro-check" value="autobus" checked>Autobús</label>
            </div>

            <div class="buscador_destinos">
                <input type="text" id="buscadorInput" placeholder="Buscar destino...">
                <span class="lupa-icon">🔍</span> </div>

            <div class="filtro_continentes">
                <select id="filtroContinente">
                    <option value="todos">Todos los continentes</option>
                    <option value="Europa">Europa</option>
                    <option value="Asia">Asia</option>
                    <option value="África">África</option>
                    <option value="Oceanía">Oceanía</option>
                    <option value="América del Norte">América del Norte</option>
                    <option value="América del Sur">América del Sur</option>
                </select>
            </div>
        </div>

        <div class="galeria-destinos" id="galeriaDestinos"></div>

    </main>

    <footer class="footer">
        <div class="footer-redes">
            <a href="https://www.instagram.com/" target="_blank"><img class="logo-redes" src="./images/instagram-logo.png" alt="logo instagram"></a>
            <a href="https://www.tiktok.com/es/" target="_blank"><img class="logo-redes" src="./images/tiktok-logo.png" alt="logo tiktok"></a>
            <a href="https://www.youtube.com/" target="_blank"><img class="logo-redes" src="./images/youtube-logo.png" alt="logo youtube"></a>
        </div>

        <h3><a href="" data-i18n="politica"> Politica de Privacidad </a></h3>
        <h3><a href="" data-i18n="nosotros"> Sobre nosotros </a></h3>
        <h3><a href="" data-i18n="ayuda"> Ayuda </a></h3>

    </footer>

<script type="module" src="script/GaleriaDestinos.js"></script>
<script src="./script/temaGlobal.js"></script>
</body>
</html>
